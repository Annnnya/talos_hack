# robot_localization ekf_node settings for the mecanum base (pixi run -e ros ekf).
#
# Each *_config list picks what to fuse from that sensor, in this fixed order:
#   x, y, z,  roll, pitch, yaw,  vx, vy, vz,  vroll, vpitch, vyaw,  ax, ay, az
/**:
  ros__parameters:
    frequency: 30.0
    # Flat floor: ignore z, roll and pitch.
    two_d_mode: true
    # Publishes odom -> base_link. Nothing else may publish that transform.
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel odometry from the robot node. Only velocities: wheel slip then
    # shows up as a velocity error instead of a jump in absolute pose.
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false

    # MPU6050 gyro. Only yaw rate: with no magnetometer its absolute yaw is meaningless, roll and
    # pitch are unused in 2D mode, and servo vibration makes the accelerometer mostly noise.
    # The raw topic keeps the EKF independent of the Madgwick filter.
    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: false
