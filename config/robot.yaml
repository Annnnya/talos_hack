# The robot, in one file: every servo joint and the mecanum base.
# The serial port and baud rate are not set here: pass --port / --baud or set TALOS_SERVO_PORT.
# Changes take effect on restart (`talos.service`, or the command you ran).

# Speed cap in steps/s for every joint. Low on purpose; the STS3215 tops out near 3000.
# Under ros2_control the base wheels skip it: mecanum_drive_controller limits them
# to max_linear_speed / max_angular_speed below.
max_speed: 1000
# How often joint state goes to the web UI and ROS.
telemetry_hz: 20
# How often the robot sends wheel speeds, reads every wheel's position and speed
# (one sync read) and reads one servo in full.
control_hz: 50
# Speed commands from ROS (/cmd_vel, velocity_cmd) stop the wheel if not repeated this often.
command_timeout_s: 0.5

joints:
  # control:  speed = spins continuously, position = goes to an angle (fixed at startup)
  # inverted: true flips direction, so positive is always forward
  # enabled:  false = listed but never used (motor not installed yet)
  front_left_wheel:  { id: 6, control: speed,    inverted: true }
  front_right_wheel: { id: 5, control: speed,    inverted: false }
  rear_left_wheel:   { id: 4, control: speed,    inverted: true }
  rear_right_wheel:  { id: 3, control: speed,    inverted: false }
  # min_pos / max_pos clamp position targets (0-4095 is one full turn). For
  # the hinge they are narrowed on load to the model bend range below.
  # Folding the hinge must lower its position: flip inverted if it rises.
  bend:              { id: 1, control: position, inverted: false,
                       min_pos: 0, max_pos: 4095 }

base:
  # Speed joints in FL, FR, RL, RR order.
  wheels: [front_left_wheel, front_right_wheel, rear_left_wheel, rear_right_wheel]
  # Front to rear axle when flat. Each leg (hinge to axle) is half of it.
  wheelbase_m: 0.31
  track_width_m: 0.128
  # Steps per metre of wheel travel are 4096 / (2 * pi * wheel_radius_m).
  wheel_radius_m: 0.03
  # m/s and rad/s; /cmd_vel and `talos-servo drive` are clamped to these.
  max_linear_speed: 0.1
  max_angular_speed: 0.5

modes:
  # ros2_control controllers active in each robot mode. The mode node switches
  # them through controller_manager; with no controller_manager running the
  # switch is skipped. List only controllers in config/ros2_control.yaml: a
  # missing one fails the switch, and so the mode change. Clamping turns the
  # wheels one by one for the expansion node (#76); climbing stays empty
  # (base stopped) until #92 adds its controller.
  controllers:
    free: [mecanum_drive_controller]
    aligning: [mecanum_drive_controller]
    clamping: [wheel_velocity_controller]
    climbing: [wheel_velocity_controller]
  # Replace the free controllers with these while the expansion node opens
  # or closes the hinge (/robot/hinge_motion), so it also works in free mode.
  hinge_motion: [wheel_velocity_controller]
  # Seconds to wait for controller_manager to answer a switch.
  switch_timeout_s: 2.0

# Body geometry, read by the Python core and description/talos.urdf.xacro.
# The robot is an inverted V: the bend hinge on top, a leg down to each wheel
# pair. bend is the opening angle between the legs: 180 flat, smaller folded.
model:
  # The position joint that opens and closes the hinge.
  hinge_joint: bend
  # Each leg gear turns this many times the servo. Both legs move, so the
  # opening angle changes 2 * 0.5 = 1 times the servo angle.
  leg_gear_ratio: 0.5
  # Max fold. Placeholder until measured on the robot (#84). The bend
  # min_pos/max_pos clamp is narrowed to this range on load.
  bend_min_deg: 90
  bend_max_deg: 180
  # Raw bend servo position (0-4095, as `talos-servo monitor` shows it) when
  # the robot lies flat, fixed by aligning the servo horn to the leg.
  # Required while bend is enabled. The range down to max fold must fit in
  # one servo turn from here. 4000 leaves about 8 deg past flat before the
  # reading wraps to 0.
  bend_flat_steps: 4000

# Opening and closing the hinge with the wheels rolling along (#76,
# `talos-expansion-ros`). See docs/ros2_control.md.
expansion:
  # Opening speed cap in rad/s. Must stay below the hinge servo speed
  # (about 0.31 rad/s at the bridge's fixed move speed).
  max_rate_rad_s: 0.15
  # How often the hinge goal and the wheel speeds are sent.
  rate_hz: 50
  # How far (rad) the hinge goal may run ahead of the measured angle before
  # the motion waits for the hinge.
  max_lead_rad: 0.05
  # Stop when /expansion/rate is not repeated this often.
  command_timeout_s: 0.5

# Holding the hinge at a current setpoint while climbing (#142,
# `talos_servo.hinge_hold`, run by the expansion node). A PI loop moves the
# hinge goal past the measured angle until the hinge current matches.
hinge_hold:
  # Setpoint cap in A. Keep it below the servo's overload protection current.
  max_current_a: 1.0
  # Goal lead change per A of error: ki in rad/s per A, kp in rad per A.
  ki: 0.3
  kp: 0.0
  # Time constant (s) of the current filter.
  filter_s: 0.1
  # How far (rad) the goal may lead the measured angle.
  max_offset_rad: 0.25
  # Opening (rad) with almost no current that counts as no wall contact.
  no_contact_rad: 0.3
