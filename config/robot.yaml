# The robot, in one file: every servo joint and the mecanum base.
# The serial port and baud rate are not set here: pass --port / --baud or set TALOS_SERVO_PORT.
# Changes take effect on restart (`talos-robot.service`, or the command you ran).

# Speed cap in steps/s for every joint. Low on purpose; the STS3215 tops out near 3000.
max_speed: 1000
# How often joint state goes to the web UI and ROS.
telemetry_hz: 20
# How often the robot sends wheel speeds and reads one servo.
control_hz: 50
# Speed commands from ROS (/cmd_vel, velocity_cmd) stop the wheel if not repeated this often.
command_timeout_s: 0.5

joints:
  # control:  speed = spins continuously, position = goes to an angle (fixed at startup)
  # inverted: true flips direction, so positive is always forward
  # enabled:  false = listed but never used (motor not installed yet)
  front_left_wheel:  { id: 6, control: speed,    inverted: true }
  front_right_wheel: { id: 5, control: speed,    inverted: false }
  rear_left_wheel:   { id: 4, control: speed,    inverted: true }
  rear_right_wheel:  { id: 3, control: speed,    inverted: false }
  # min_pos / max_pos clamp position targets (0-4095 is one full turn). Set real limits first.
  bend:              { id: 1, control: position, inverted: false, enabled: false,
                       min_pos: 0, max_pos: 4095 }

base:
  # Speed joints in FL, FR, RL, RR order.
  wheels: [front_left_wheel, front_right_wheel, rear_left_wheel, rear_right_wheel]
  # Front to rear axle when flat. Each leg (hinge to axle) is half of it.
  wheelbase_m: 0.31
  track_width_m: 0.128
  # Steps per metre of wheel travel are 4096 / (2 * pi * wheel_radius_m).
  wheel_radius_m: 0.03
  # m/s and rad/s; /cmd_vel and `talos-servo drive` are clamped to these.
  max_linear_speed: 0.1
  max_angular_speed: 0.5

modes:
  # ros2_control controllers active in each robot mode. The mode node switches
  # them through controller_manager. Placeholders until the controllers exist
  # (#65, #76, #92); with no controller_manager running the switch is skipped.
  controllers:
    free: [mecanum_drive_controller]
    aligning: [mecanum_drive_controller]
    clamping: [expansion_controller]
    climbing: [wall_drive_controller]
  # Seconds to wait for controller_manager to answer a switch.
  switch_timeout_s: 2.0

# Body geometry, read by the Python core and description/talos.urdf.xacro.
# The robot is an inverted V: the bend hinge on top, a leg down to each wheel
# pair. bend is the opening angle between the legs: 180 flat, smaller folded.
model:
  # The position joint that opens and closes the hinge.
  hinge_joint: bend
  # Each leg gear turns this many times the servo. Both legs move, so the
  # opening angle changes 2 * 0.5 = 1 times the servo angle.
  leg_gear_ratio: 0.5
  # Max fold. Placeholder until measured on the robot (#84). These are the
  # model limits only: the servo clamp is joints.bend min_pos/max_pos, still
  # a full turn, and #84 tightens it to match once the hinge is measured.
  bend_min_deg: 90
  bend_max_deg: 180
