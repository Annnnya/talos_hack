[workspace]
name = "talos_hack"
description = "Software and tests for the Talos robot (physical AI hackathon)"
# robostack-jazzy provides ROS 2 Jazzy packages (ros-jazzy-*) for when we add ROS
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["win-64", "linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
# Must match the Python that RoboStack Jazzy is built against
python = "3.12.*"
pyserial = ">=3.5"
pytest = ">=8"
httpx = ">=0.27"
ruff = ">=0.6"

[pypi-dependencies]
# Editable install of our package with the web extra; also pulls ftservo-python-sdk from PyPI
talos-servo = { path = ".", editable = true, extras = ["web"] }

[tasks]
test = "pytest"
lint = "ruff check ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."
check = { depends-on = ["lint", "fmt-check", "test"] }

# ROS 2 Jazzy for the servo bridge node. Separate environment so the default one stays light.
[feature.ros.dependencies]
ros-jazzy-ros-base = "*"
ros-jazzy-diagnostic-msgs = "*"

[feature.ros.tasks]
servo-node = "talos-servo-ros"
servo-node-mock = "talos-servo-ros --mock"

[environments]
ros = ["ros"]
