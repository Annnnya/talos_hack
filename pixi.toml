[workspace]
name = "talos_hack"
description = "Software and tests for the Talos robot (physical AI hackathon)"
# robostack-jazzy provides ROS 2 Jazzy packages (ros-jazzy-*) for when we add ROS
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["win-64", "linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
# Must match the Python that RoboStack Jazzy is built against
python = "3.12.*"
pyserial = ">=3.5"
pytest = ">=8"
httpx = ">=0.27"
ruff = ">=0.6"

[target.linux-64.dependencies]
ros-jazzy-rclpy = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-std-srvs = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-diagnostic-msgs = "*"
ros-jazzy-ros2cli = "*"
ros-jazzy-ros2run = "*"
ros-jazzy-ros2service = "*"
colcon-ros = "*"
colcon-python-setup-py = "*"

[target.linux-aarch64.dependencies]
ros-jazzy-rclpy = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-std-srvs = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-diagnostic-msgs = "*"
ros-jazzy-ros2cli = "*"
ros-jazzy-ros2run = "*"
ros-jazzy-ros2service = "*"
colcon-ros = "*"
colcon-python-setup-py = "*"

[pypi-dependencies]
# Editable install of our package with the web and imu extras; also pulls ftservo-python-sdk from PyPI
talos-servo = { path = ".", editable = true, extras = ["web", "imu"] }

[tasks]
test = "pytest"
lint = "ruff check ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."
check = { depends-on = ["lint", "fmt-check", "test"] }
ros-build = "colcon build --base-paths ros2_ws/src"
drive = "bash -c 'source install/setup.sh && ros2 run talos_mecanum drive_node --ros-args --params-file ros2_ws/src/talos_mecanum/config/robot.yaml'"
teleop = "bash -c 'source install/setup.sh && ros2 run talos_mecanum keyboard_teleop'"

# ROS 2 Jazzy for the servo bridge node. Separate environment so the default one stays light.
[feature.ros.dependencies]
ros-jazzy-ros-base = "*"
ros-jazzy-diagnostic-msgs = "*"

[feature.ros.tasks]
servo-node = "talos-servo-ros"
servo-node-mock = "talos-servo-ros --mock"

[environments]
ros = ["ros"]
