[workspace]
name = "talos_hack"
description = "Software and tests for the Talos robot (physical AI hackathon)"
# robostack-jazzy provides ROS 2 Jazzy packages (ros-jazzy-*) for when we add ROS
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["win-64", "linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
# Must match the Python that RoboStack Jazzy is built against
python = "3.12.*"
pyserial = ">=3.5"
pytest = ">=8"
httpx = ">=0.27"
ruff = ">=0.6"

[target.linux-64.dependencies]
ros-jazzy-rclpy = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-nav-msgs = "*"
ros-jazzy-std-srvs = "*"
ros-jazzy-controller-manager-msgs = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-diagnostic-msgs = "*"
ros-jazzy-std-msgs = "*"
ros-jazzy-ros2cli = "*"
ros-jazzy-ros2run = "*"
ros-jazzy-ros2service = "*"

[target.linux-aarch64.dependencies]
ros-jazzy-rclpy = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-nav-msgs = "*"
ros-jazzy-std-srvs = "*"
ros-jazzy-controller-manager-msgs = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-diagnostic-msgs = "*"
ros-jazzy-std-msgs = "*"
ros-jazzy-ros2cli = "*"
ros-jazzy-ros2run = "*"
ros-jazzy-ros2service = "*"

[pypi-dependencies]
# Editable install of our package with the web and imu extras; also pulls ftservo-python-sdk from PyPI
talos-servo = { path = ".", editable = true, extras = ["web", "imu"] }

[tasks]
test = "pytest"
lint = "ruff check ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."
check = { depends-on = ["lint", "fmt-check", "test"] }

# ROS 2 Jazzy for the robot node. Separate environment so the default one
# stays light.
[feature.ros.dependencies]
ros-jazzy-ros-base = "*"
ros-jazzy-diagnostic-msgs = "*"
ros-jazzy-imu-filter-madgwick = "*"
ros-jazzy-robot-localization = "*"
ros-jazzy-twist-mux = "*"
# ros2_control (see docs/ros2_control.md). topic_based_ros2_control is the
# ready-made C++ hardware plugin that hands joint commands and states to our
# Python hardware bridge node over topics.
ros-jazzy-controller-manager = "*"
ros-jazzy-ros2-controllers = "*"
ros-jazzy-ros2controlcli = "*"
ros-jazzy-topic-based-ros2-control = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-xacro = "*"

[feature.ros.tasks]
# The only program on the servo port; everything else goes through it
robot-node = "talos-robot-ros"
# Keyboard driving through the robot node
drive = "talos-servo drive --ros"
# CSI camera node: snapshots and a low-rate stream
camera-node = "talos-camera-ros --ros-args --params-file config/camera.yaml"
imu-node = "talos-imu-ros"
# Robot mode (free, aligning, clamping, climbing); switches controllers
mode-node = "talos-mode-ros"
# Turns /imu/data_raw into /imu/data with an orientation quaternion
imu-filter = "ros2 run imu_filter_madgwick imu_filter_madgwick_node --ros-args --params-file config/imu_filter.yaml"
# Where the IMU sits on the robot. All zeros until the board is mounted: then measure it and
# fill in --x --y --z (m) and --roll --pitch --yaw (rad)
imu-tf = "ros2 run tf2_ros static_transform_publisher --frame-id base_link --child-frame-id imu_link"
# Fuses /odom and /imu/data_raw into /odometry/filtered and the odom -> base_link transform
ekf = "ros2 run robot_localization ekf_node --ros-args --params-file config/ekf.yaml"
# ros2_control bench check (#88): controller_manager with the topic based
# plugin plus our hardware bridge on one wheel. Replaces robot-node, which must
# not run at the same time. See docs/ros2_control.md
hardware-bridge = "talos-hardware-bridge-ros"
ros2-control-check = "ros2 launch launch/ros2_control_check.launch.py"
# Robot model (#64): print the URDF, or check it with check_urdf
model-urdf = "xacro description/talos.urdf.xacro"
check-model = "xacro description/talos.urdf.xacro -o .pixi/talos.urdf && check_urdf .pixi/talos.urdf"
# Web UI through the running robot node, so it can share the robot
# with other ROS nodes
web-ros = "talos-servo web --ros"
# Web and keyboard share /cmd_vel through one mux, with a STOP lock
twist-mux = "ros2 run twist_mux twist_mux --ros-args --params-file config/twist_mux.yaml -r cmd_vel_out:=/cmd_vel"
# Publishes which mux input drives the base on /robot/active_input
mux-status = "talos-mux-status-ros --ros-args --params-file config/twist_mux.yaml"

# RViz2 and joint sliders to look at the robot model. Own environment so the
# Pi does not install them.
[feature.viz.dependencies]
ros-jazzy-rviz2 = "*"
ros-jazzy-joint-state-publisher-gui = "*"

[feature.viz.tasks]
view-model = "ros2 launch launch/view_model.launch.py"

[environments]
ros = ["ros"]
viz = ["ros", "viz"]
