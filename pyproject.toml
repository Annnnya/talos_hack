[project]
name = "talos-servo"
version = "0.1.0"
description = "Feetech STS/SMS servo tools for the Talos robot (physical AI hackathon)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ftservo-python-sdk>=2.0.1",
    "pyserial>=3.5",
]

[project.scripts]
talos-servo = "talos_servo.cli:main"
# Needs rclpy, which only the pixi `ros` environment provides
talos-robot-ros = "talos_servo.ros.robot_node:main"
talos-imu-ros = "talos_servo.ros.imu_node:main"
talos-mode-ros = "talos_servo.ros.mode_node:main"
talos-mux-status-ros = "talos_servo.ros.mux_status_node:main"
talos-hardware-bridge-ros = "talos_servo.ros.hardware_bridge_node:main"
talos-camera-ros = "talos_servo.ros.camera_node:main"

[project.optional-dependencies]
imu = [
    "smbus2>=0.4",
]
web = [
    "fastapi>=0.115",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
    "talos-servo[imu,web]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talos_servo"]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
# ROS launch packages, not our launch/ folder
known-third-party = ["launch", "launch_ros"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.sources]
talos-servo = { workspace = true }
