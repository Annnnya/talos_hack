[project]
name = "talos-servo"
version = "0.1.0"
description = "Feetech STS/SMS servo tools for the Talos robot (physical AI hackathon)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ftservo-python-sdk>=2.0.1",
    "pyserial>=3.5",
]

[project.scripts]
talos-servo = "talos_servo.cli:main"

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
    "talos-servo[web]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talos_servo"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.sources]
talos-servo = { workspace = true }
